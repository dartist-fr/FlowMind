name: Validate FlowMind

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Verify production output
        run: |
          test -f dist/index.html
          grep -q '/FlowMind/assets/' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
          ! grep -q '%BASE_URL%' dist/index.html
